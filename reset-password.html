<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПУТЬ — восстановление пароля</title>
<style>
body{margin:0;background:#0A0B0F;color:#EDEBE6;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(440px,100%);background:#12141b;border:1px solid #2a2d38;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:28px}p{color:#a9abb5;line-height:1.55}label{display:block;margin:18px 0 7px;font-size:13px;color:#c9cad1}input{width:100%;box-sizing:border-box;background:#0b0d12;color:#fff;border:1px solid #343846;border-radius:10px;padding:13px;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#8B5CF6;color:white;font-weight:700;font-size:15px;cursor:pointer}.msg{margin-top:14px;line-height:1.5;color:#bfc2cc}.error{color:#ff8e8e}.lang{float:right;background:none;width:auto;margin:0;padding:0;color:#aaa}.hidden{display:none}.back{display:block;text-align:center;margin-top:16px;color:#aaa;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
<button class="lang" id="langBtn">EN</button>
<h1 id="title">Восстановление пароля</h1>
<p id="sub">Создай новый пароль для аккаунта ПУТЬ.</p>
<div id="form">
<label id="passLabel">Новый пароль</label>
<input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Минимум 6 символов">
<label id="pass2Label">Повтори пароль</label>
<input id="password2" type="password" minlength="6" autocomplete="new-password" placeholder="Повтори пароль">
<button id="saveBtn">Сохранить новый пароль</button>
</div>
<div class="msg" id="msg"></div>
<a class="back" id="back" href="./index.html">Вернуться</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gibzdydxpavidqmzivsr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_lAGIDjSjiC-4x5d12w7CpQ_0qwo0Dbb';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const ru={title:'Восстановление пароля',sub:'Создай новый пароль для аккаунта ПУТЬ.',pass:'Новый пароль',pass2:'Повтори пароль',ph:'Минимум 6 символов',ph2:'Повтори пароль',save:'Сохранить новый пароль',success:'Пароль успешно изменён. Теперь вернись в приложение и войди с новым паролем.',bad:'Пароли не совпадают.',short:'Пароль должен содержать минимум 6 символов.',generic:'Не удалось изменить пароль. Возможно, ссылка устарела или уже использована.',back:'Вернуться в приложение',lang:'EN'};
const en={title:'Password recovery',sub:'Create a new password for your PATH account.',pass:'New password',pass2:'Repeat password',ph:'At least 6 characters',ph2:'Repeat password',save:'Save new password',success:'Password changed successfully. Return to the app and sign in with your new password.',bad:'Passwords do not match.',short:'Password must be at least 6 characters.',generic:'Could not change the password. The link may be expired or already used.',back:'Return to app',lang:'RU'};
let lang=(navigator.language||'ru').toLowerCase().startsWith('ru')?'ru':'en';
function L(){return lang==='ru'?ru:en}
function apply(){const l=L();document.documentElement.lang=lang;title.textContent=l.title;sub.textContent=l.sub;passLabel.textContent=l.pass;pass2Label.textContent=l.pass2;password.placeholder=l.ph;password2.placeholder=l.ph2;saveBtn.textContent=l.save;back.textContent=l.back;langBtn.textContent=l.lang}
langBtn.onclick=()=>{lang=lang==='ru'?'en':'ru';apply()};
const msg=document.getElementById('msg');
async function savePassword(){const a=password.value,b=password2.value;if(a.length<6){msg.className='msg error';msg.textContent=L().short;return}if(a!==b){msg.className='msg error';msg.textContent=L().bad;return}saveBtn.disabled=true;try{const {error}=await client.auth.updateUser({password:a});if(error)throw error;msg.className='msg';msg.textContent=L().success;form.classList.add('hidden');}catch(e){console.error(e);msg.className='msg error';msg.textContent=L().generic}finally{saveBtn.disabled=false}}
saveBtn.onclick=savePassword;
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){} });
apply();
</script>
</body>
</html>
